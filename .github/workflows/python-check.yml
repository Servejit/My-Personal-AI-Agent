name: Python syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python modules
        run: python -m compileall -q app.py core tasks

      - name: Smoke test built-in Python music generator
        run: |
          python - <<'PY'
          import io
          import wave
          from core.procedural_music import generate_instrumental

          audio = generate_instrumental(
              title="CI smoke test",
              genre="Ambient",
              mood="Peaceful",
              duration=8,
              bpm=90,
              seed=17,
              prompt="soft and calm",
          )
          with wave.open(io.BytesIO(audio), "rb") as track:
              assert track.getnchannels() == 1
              assert track.getsampwidth() == 2
              assert track.getframerate() == 16000
              assert track.getnframes() == 8 * 16000
          print("Music generator smoke test passed.")

          vocal_audio = generate_instrumental(
              title="Vocal smoke test",
              genre="Punjabi-inspired",
              mood="Uplifting",
              duration=8,
              bpm=100,
              seed=19,
              lyrics="music generation",
          )
          with wave.open(io.BytesIO(vocal_audio), "rb") as track:
              assert track.getnframes() == 8 * 16000
          print("Experimental vocal-layer smoke test passed.")
          PY
